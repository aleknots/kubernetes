apiVersion: v1
kind: Service
metadata:
  name: kong-manager-auth
  namespace: lab-kong
  labels:
    app: kong-manager-auth
    app.kubernetes.io/part-of: kong-lab
    app.kubernetes.io/component: manager-auth
spec:
  type: ClusterIP
  selector:
    app: kong-manager-auth
  ports:
    - name: http
      port: 8002
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-auth
  namespace: lab-kong
  labels:
    app: kong-manager-auth
    app.kubernetes.io/part-of: kong-lab
    app.kubernetes.io/component: manager-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-auth
  template:
    metadata:
      labels:
        app: kong-manager-auth
        app.kubernetes.io/part-of: kong-lab
        app.kubernetes.io/component: manager-auth
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: kong-manager-auth-nginx
        - name: auth
          secret:
            secretName: kong-manager-basic-auth
