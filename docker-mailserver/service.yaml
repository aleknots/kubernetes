apiVersion: v1
kind: Service
metadata:
  name: mailserver-service
  namespace: mailserver
  labels:
    app.kubernetes.io/name: docker-mailserver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docker-mailserver
  ports:
    - name: smtp
      port: 25
      targetPort: 25
      protocol: TCP
    - name: smtps
      port: 465
      targetPort: 465
      protocol: TCP
    - name: submission
      port: 587
      targetPort: 587
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: 993
      protocol: TCP
