apiVersion: v1
kind: Secret
metadata:
  name: mailserver-secret
  namespace: mailserver
  labels:
    app.kubernetes.io/name: docker-mailserver
type: Opaque
stringData:
  # Credenciais do provedor de SMTP Relay de saída (ex: Amazon SES ou Brevo)
  # Substitua pelos valores reais fornecidos pelo seu provedor
  RELAY_USER: "seu-usuario-relay@airqloud.com.br"
  RELAY_PASS: "sua-senha-ou-api-key-relay"
---
# Exemplo de Secret TLS caso você insira manualmente os certificados Let's Encrypt
# Nota: Se estiver utilizando Cert-Manager no cluster, este Secret será gerenciado automaticamente pelo Ingress/Certificate.
apiVersion: v1
kind: Secret
metadata:
  name: mailserver-tls
  namespace: mailserver
  labels:
    app.kubernetes.io/name: docker-mailserver
type: kubernetes.io/tls
stringData:
  # Substitua pelos certificados válidos do seu domínio (ex: obtidos via certbot ou cert-manager)
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIID... (Seu certificado fullchain.pem para mail.airqloud.com.br)
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIE... (Sua chave privada privkey.pem para mail.airqloud.com.br)
    -----END PRIVATE KEY-----
