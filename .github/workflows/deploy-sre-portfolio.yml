name: Implantação do SRE Portfolio no Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'sre-portfolio/**'
      - '.github/workflows/deploy-sre-portfolio.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Multi-Arch & Implantação no K8s
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU (Suporte a Multi-Arquitetura ARM64/AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Multi-Arch (linux/amd64, linux/arm64)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./sre-portfolio
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            aleknots/sre-portfolio:latest
            aleknots/sre-portfolio:v1
            aleknots/sre-portfolio:${{ github.sha }}

      - name: Configurar o kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configurar Kubeconfig e Ponte SSH via Bastion Host
        run: |
          mkdir -p ~/.kube ~/.ssh
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

          # Redireciona a URL do cluster para o túnel local 127.0.0.1:6443
          sed -i 's|https://10.0.2.11:6443|https://127.0.0.1:6443|g' ~/.kube/config

          if [ -n "${{ secrets.BASTION_HOST }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Conectando ponte SSH via Bastion Host..."
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ secrets.BASTION_HOST }} >> ~/.ssh/known_hosts
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -f -N -L 6443:10.0.2.11:6443 opc@${{ secrets.BASTION_HOST }}
          fi

      - name: Aplicar Manifesto no Kubernetes
        run: |
          kubectl apply -f sre-portfolio/k8s/deployment.yaml --insecure-skip-tls-verify=true
          kubectl rollout restart deployment/sre-portfolio -n default --insecure-skip-tls-verify=true
          kubectl rollout status deployment/sre-portfolio -n default --timeout=120s --insecure-skip-tls-verify=true
