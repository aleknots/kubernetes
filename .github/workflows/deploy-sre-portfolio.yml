name: Implantação do SRE Portfolio no Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'sre-portfolio/**'
      - '.github/workflows/deploy-sre-portfolio.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker & Implantação no K8s
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Autenticar no Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./sre-portfolio
          push: true
          tags: |
            aleknots/sre-portfolio:latest
            aleknots/sre-portfolio:v1
            aleknots/sre-portfolio:${{ github.sha }}

      - name: Configurar o kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configurar Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Estabelecer Ponte SSH via Bastion Host
        if: ${{ env.BASTION_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.BASTION_HOST }} >> ~/.ssh/known_hosts
          
          # Inicia o túnel SSH em background (redireciona 127.0.0.1:6443 para 10.0.2.11:6443 via Bastion)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -f -N -L 6443:10.0.2.11:6443 opc@${{ secrets.BASTION_HOST }}
          
          # Atualiza o endereço do cluster no Kubeconfig para apontar para o túnel local
          sed -i 's|https://10.0.2.11:6443|https://127.0.0.1:6443|g' ~/.kube/config

      - name: Aplicar Manifesto no Kubernetes
        run: |
          kubectl apply -f sre-portfolio/k8s/deployment.yaml --insecure-skip-tls-verify=true
          kubectl rollout status deployment/sre-portfolio -n default --timeout=120s --insecure-skip-tls-verify=true
