apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: admin-basic-auth
  namespace: lab-app
  annotations:
    kubernetes.io/ingress.class: kong
plugin: basic-auth
config:
  hide_credentials: false
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-user-basic-auth
  namespace: lab-app
  labels:
    konghq.com/credential: basic-auth
type: Opaque
stringData:
  kongCredType: basic-auth
  username: admin
  password: admin123
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: admin-user
  namespace: lab-app
  annotations:
    kubernetes.io/ingress.class: kong
username: admin
credentials:
  - admin-user-basic-auth
