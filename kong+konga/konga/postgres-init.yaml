apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: lab-kong
data:
  init-konga.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'konga') THEN
          CREATE USER konga WITH PASSWORD 'konga';
        END IF;
      END
      \$\$;
      SELECT 'CREATE DATABASE konga OWNER konga'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'konga')\gexec
      GRANT ALL PRIVILEGES ON DATABASE konga TO konga;
    EOSQL
