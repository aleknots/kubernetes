apiVersion: v1
kind: Service
metadata:
  name: konga
  namespace: lab-kong
  labels:
    app: konga
spec:
  type: ClusterIP
  selector:
    app: konga
  ports:
    - name: http
      port: 1337
      targetPort: 1337
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: konga
  namespace: lab-kong
  labels:
    app: konga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: konga
  template:
    metadata:
      labels:
        app: konga
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:11-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h postgres -U kong -d kong; do
                echo "waiting for postgres..."
                sleep 2
              done
        - name: prepare-db
          image: pantsel/konga:0.14.9
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              node ./bin/konga.js prepare \
                --adapter postgres \
                --uri "postgresql://konga@postgres:5432/konga"
      containers:
        - name: konga
          image: pantsel/konga:0.14.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1337
          env:
            - name: NODE_ENV
              value: production
            - name: DB_ADAPTER
              value: postgres
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: konga
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-postgres
                  key: konga-password
            - name: DB_DATABASE
              value: konga
            - name: KONGA_LOG_LEVEL
              value: warn
          readinessProbe:
            httpGet:
              path: /
              port: 1337
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 1337
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
