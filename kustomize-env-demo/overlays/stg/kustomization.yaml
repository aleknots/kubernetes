# Overlay STG: herda de base e sobrescreve valores específicos do ambiente.
# Modificar este arquivo não afeta DEV nem PRD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-banner-stg # aplica este namespace a todos os recursos herdados de base
resources:
  - ../../base # Deployment + Service comuns
patches: # Patches JSON sobre o base (RFC 6902)
  - target: # recurso alvo a partir de base
      kind: Deployment
      name: app-banner # metadata.name do Deployment em base/deployment.yaml
    patch: |- # Bloco YAML = lista de operações JSON Patch
      - op: replace         # substitui o valor existente no caminho alvo
        path: /spec/template/spec/containers/0/env/0/value
        value: STAGING      # env[0] = ENV_NAME → texto do banner
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "#FD35B7"    # env[1] = BG_COLOR → cor de fundo
      - op: replace
        path: /spec/containers/0/image
        value: aleknots/app-banner:v2 # sobrescreve a imagem para STG
