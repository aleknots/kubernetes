# AppProject "lab" - necessário antes que qualquer Aplicação possa usar spec.project: lab.
# O Argo traz apenas o projeto "default" por padrão. Alterar o nome no YAML da Aplicação
# não é suficiente; este CR precisa existir no namespace argocd.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
  namespace: argocd
spec:
  description: demonstração app-banner (kind)
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
