# Aplicação Pai (App-of-Apps).
# Sincroniza todos os YAMLs de Aplicação sob applications/ no namespace argocd.
# Se você excluir app-banner-dev na UI, o selfHeal recria a partir do Git.
#
# Bootstrap único:
#   kubectl apply -f kustomize-env-demo/argocd/app-root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-banner-root
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/aleknots/Kubernetes.git
    targetRevision: main
    path: kustomize-env-demo/argocd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
