# Patch aplicado após a instalação oficial do Argo CD (create-lab.sh).
# A reconciliação padrão é de 180s; isso ajusta a busca no Git/cluster para 1 minuto.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  timeout.reconciliation: "60s"
